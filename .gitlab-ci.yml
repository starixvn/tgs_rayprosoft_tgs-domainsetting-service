include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: Tgs.DomainSetting.$CI_PIPELINE_IID
  ImageName: pgtgs/domain-setting
  HelmTemplateFolderName: domain-setting
  TgsSettingKey: domain-setting

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.DomainSetting.Client"

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.DomainSettingService/Tgs.DomainSettingService.csproj" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_tempalte $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-template
  variables:
    kube_config: KubeConfig_Raypro_dev
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  extends: .deploy-template
  variables:
    kube_config: KubeConfig_Raypro_staging
    namespace: staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace   

deploy-prod:
  extends: .deploy-template
  variables:
    kube_config: KubeConfig_Raypro_prod
    namespace: prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace   
